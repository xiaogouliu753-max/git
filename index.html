<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="description" content="轻触织机上的红蓝丝绸，以拖拽和丝线轨迹探索艾德莱斯绸九道工序与四类纹样。">
    <title>艾德莱斯绸｜技艺与纹样</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <canvas id="silk-trail" aria-hidden="true"></canvas>

    <main>
      <section id="story" class="panel story" aria-label="艾德莱斯绸制作流程">
        <div id="home-screen" class="story-layer home-screen is-active">
          <div class="home-stage">
            <img class="home-background" src="assets/v4/home-bg.png" alt="艾德莱斯绸交互首页" draggable="false">
            <div class="loom-wrap">
              <img class="loom-animation" src="assets/v4/loom.gif" alt="织机循环织出红蓝艾德莱斯绸" draggable="false">
              <button class="fabric-trigger fabric-trigger-top" type="button" aria-label="轻触红蓝丝绸，打开制作工序卡片"></button>
              <button class="fabric-trigger fabric-trigger-bottom" type="button" aria-label="轻触织出的红蓝丝绸，打开制作工序卡片"></button>
            </div>
            <p class="home-hint">轻触织出的红蓝丝绸 <span>TOUCH THE WOVEN SILK</span></p>
          </div>
        </div>

        <div id="slider-screen" class="story-layer slider-screen" aria-hidden="true">
          <div class="story-dimmer" aria-hidden="true"></div>
          <div id="transition-card" class="transition-card" hidden aria-hidden="true">
            <span class="transition-line"></span>
            <span class="transition-diamond transition-diamond-red"></span>
            <span class="transition-diamond transition-diamond-blue"></span>
            <span class="transition-diamond transition-diamond-paper"></span>
          </div>

          <div id="deck-shell" class="deck-shell" aria-label="九道制作工序拖拽卡片">
            <img class="deck-background" src="assets/v4/deck-bg.png" alt="工序卡片纸张底板" draggable="false">
            <div class="deck-window">
              <div id="process-track" class="process-track"></div>
            </div>
            <div class="slide-caption" aria-live="polite">
              <span id="slide-number">01 / 09</span>
              <span id="slide-name">煮茧抽丝</span>
              <span class="slide-instruction">向左拖动 <b>DRAG LEFT</b></span>
            </div>
            <div id="slide-dots" class="slide-dots" aria-hidden="true"></div>
          </div>
        </div>

        <div id="completion" class="completion" role="dialog" aria-modal="true" aria-labelledby="completion-title" hidden>
          <div class="completion-card">
            <img src="assets/v3/process-card.png" alt="艾德莱斯绸制作九道工序总览">
            <h2 id="completion-title" class="visually-hidden">艾德莱斯绸制作九道工序</h2>
            <button id="close-completion" class="close-completion" type="button" aria-label="关闭并返回首页">×</button>
          </div>
        </div>
      </section>

      <section id="pattern-page" class="panel pattern-page" aria-label="艾德莱斯纹样四大类别">
        <div id="pattern-frame" class="pattern-frame">
          <img id="pattern-image" src="assets/v4/patterns-1.png" alt="艾德莱斯纹样：器物纹、植物纹、几何纹、自然纹" loading="lazy" draggable="false">
          <button class="pattern-hotspot pattern-one" type="button" data-pattern="1" aria-label="突出显示器物纹"></button>
          <button class="pattern-hotspot pattern-two" type="button" data-pattern="2" aria-label="突出显示植物纹"></button>
          <button class="pattern-hotspot pattern-three" type="button" data-pattern="3" aria-label="突出显示几何纹"></button>
          <button class="pattern-hotspot pattern-four" type="button" data-pattern="4" aria-label="突出显示自然纹"></button>
        </div>
      </section>
    </main>

    <noscript>请启用 JavaScript，以拖拽浏览制作流程并体验纹样卡片。</noscript>
  </body>
</html>
