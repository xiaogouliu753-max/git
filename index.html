<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="description" content="以拖拽和丝线轨迹探索艾德莱斯绸九道制作工序与四类传统纹样。">
    <title>艾德莱斯绸｜技艺与纹样</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <canvas id="silk-trail" aria-hidden="true"></canvas>

    <main>
      <section id="story" class="panel story" aria-label="艾德莱斯绸制作流程">
        <div id="home-screen" class="story-layer home-screen is-active">
          <div class="media-frame">
            <img src="assets/v3/home.png" alt="艾德莱斯绸织机与织锦" draggable="false">
            <button id="enter-story" class="intro-card" type="button" aria-label="拖动或点击，开始探索制作流程">
              <span class="intro-line" aria-hidden="true"></span>
              <span class="intro-diamond intro-diamond-red" aria-hidden="true"></span>
              <span class="intro-diamond intro-diamond-blue" aria-hidden="true"></span>
              <span class="intro-diamond intro-diamond-paper" aria-hidden="true"></span>
            </button>
            <p class="home-hint">拖动卡片，循丝而行 <span>DRAG TO EXPLORE</span></p>
          </div>
        </div>

        <div id="slider-screen" class="story-layer slider-screen" aria-hidden="true">
          <div id="process-track" class="process-track"></div>
          <div class="slide-caption" aria-live="polite">
            <span id="slide-number">01</span>
            <span id="slide-name">煮茧抽丝</span>
            <span class="slide-instruction">拖拽探索 <b>DRAG TO EXPLORE</b></span>
          </div>
          <div id="slide-dots" class="slide-dots" aria-hidden="true"></div>
        </div>

        <div id="completion" class="completion" role="dialog" aria-modal="true" aria-labelledby="completion-title" hidden>
          <div class="completion-card">
            <img src="assets/v3/process-card.png" alt="艾德莱斯绸制作九道工序总览">
            <h2 id="completion-title" class="visually-hidden">艾德莱斯绸制作九道工序</h2>
            <button id="close-completion" class="close-completion" type="button" aria-label="关闭并返回首页">×</button>
          </div>
        </div>
      </section>

      <section id="patterns-hero" class="panel image-panel" aria-label="艾德莱斯纹样四大类别">
        <div class="media-frame">
          <img src="assets/v3/patterns-hero.png" alt="艾德莱斯纹样，器物纹、植物纹、几何纹、自然纹四类卡片" loading="lazy" draggable="false">
        </div>
      </section>

      <section id="pattern-archive" class="panel image-panel pattern-archive" aria-label="艾德莱斯纹样档案交互卡片">
        <div id="archive-frame" class="media-frame archive-frame">
          <img id="archive-image" src="assets/v3/patterns-base.png" alt="四类艾德莱斯纹样档案卡片" loading="lazy" draggable="false">
          <button class="pattern-hotspot pattern-one" type="button" data-pattern="1" aria-label="突出显示器物纹"></button>
          <button class="pattern-hotspot pattern-two" type="button" data-pattern="2" aria-label="突出显示植物纹"></button>
          <button class="pattern-hotspot pattern-three" type="button" data-pattern="3" aria-label="突出显示几何纹"></button>
          <button class="pattern-hotspot pattern-four" type="button" data-pattern="4" aria-label="突出显示自然纹"></button>
        </div>
      </section>
    </main>

    <noscript>请启用 JavaScript，以拖拽浏览完整制作流程并体验纹样卡片。</noscript>
  </body>
</html>
